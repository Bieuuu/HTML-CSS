<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 500px;
            border-collapse: collapse;
        }

        td, th {
            border: 1px solid black;
            padding: 5px;
        }
        
        tfoot, thead {
            background-color: gray;
            color: white;
        }
    </style>
</head>
<body>
    <h1>uso de tablelas grandes</h1>
    <table>
        <caption>
            Populaçao
        </caption>
        <thead>
            <tr>
                <th scope="col">Estado</th>
                <th scope="col">Populaçao</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Sao paulo</td>
                <td>45 919 049</td>
            </tr>
            <tr>
                <td>Sao paulo</td>
                <td>45 919 049</td>
            </tr>
            <tr>
                <td>Sao paulo</td>
                <td>45 919 049</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th scope="row">Total de habitantes</th>
                <td>(total)</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
